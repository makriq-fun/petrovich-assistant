[workspace]
resolver = "2"
members = [
    "crates/petrovich-core",
    "crates/petrovich-audio",
    "crates/petrovich-wakeword",
    "crates/petrovich-providers",
    "crates/petrovich-tools",
    "crates/petrovich-hw",
    "crates/petrovichd",
    "crates/petrovichctl",
]

[workspace.package]
version = "0.3.4"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/makriq-fun/petrovich-assistant"
authors = ["Petrovich Assistant contributors"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "fs", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

petrovich-core = { path = "crates/petrovich-core" }
petrovich-audio = { path = "crates/petrovich-audio" }
petrovich-wakeword = { path = "crates/petrovich-wakeword" }
petrovich-providers = { path = "crates/petrovich-providers" }
petrovich-tools = { path = "crates/petrovich-tools" }
petrovich-hw = { path = "crates/petrovich-hw" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = 3
