[workspace]
resolver = "2"
members = [
    "crates/skynet-core",
    "crates/skynet-audio",
    "crates/skynet-wakeword",
    "crates/skynet-providers",
    "crates/skynet-tools",
    "crates/skynet-hw",
    "crates/skynetd",
    "crates/skynetctl",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/makriq/skynet-station"
authors = ["Skynet Station contributors"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "fs", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

skynet-core = { path = "crates/skynet-core" }
skynet-audio = { path = "crates/skynet-audio" }
skynet-wakeword = { path = "crates/skynet-wakeword" }
skynet-providers = { path = "crates/skynet-providers" }
skynet-tools = { path = "crates/skynet-tools" }
skynet-hw = { path = "crates/skynet-hw" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = 3
