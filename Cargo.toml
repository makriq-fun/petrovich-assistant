[workspace]
resolver = "2"
members = [
    "crates/jarvis-core",
    "crates/jarvis-audio",
    "crates/jarvis-wakeword",
    "crates/jarvis-providers",
    "crates/jarvis-tools",
    "crates/jarvis-hw",
    "crates/jarvisd",
    "crates/jarvisctl",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/makriq/jarvis-station"
authors = ["Jarvis Station contributors"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "fs", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

jarvis-core = { path = "crates/jarvis-core" }
jarvis-audio = { path = "crates/jarvis-audio" }
jarvis-wakeword = { path = "crates/jarvis-wakeword" }
jarvis-providers = { path = "crates/jarvis-providers" }
jarvis-tools = { path = "crates/jarvis-tools" }
jarvis-hw = { path = "crates/jarvis-hw" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = 3
