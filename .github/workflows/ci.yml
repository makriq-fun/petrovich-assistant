name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Python-тесты установщика
        run: python3 -m unittest discover -s installer/tests -v
  arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - run: cross build --locked --release --target armv7-unknown-linux-musleabihf -p jarvisd -p jarvisctl
      - run: |
          mkdir -p dist
          install -m755 target/armv7-unknown-linux-musleabihf/release/jarvisd dist/jarvisd
          install -m755 target/armv7-unknown-linux-musleabihf/release/jarvisctl dist/jarvisctl
          ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-station-armv7
          path: dist/*.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - run: cross build --locked --release --target armv7-unknown-linux-musleabihf -p jarvisd -p jarvisctl
      - run: |
          mkdir -p dist
          install -m755 target/armv7-unknown-linux-musleabihf/release/jarvisd dist/jarvisd
          install -m755 target/armv7-unknown-linux-musleabihf/release/jarvisctl dist/jarvisctl
          ./scripts/package.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
