[package]
name = "petrovichd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
petrovich-audio = { workspace = true }
petrovich-core = { workspace = true }
petrovich-hw = { workspace = true }
petrovich-providers = { workspace = true }
petrovich-tools = { workspace = true }
libc = { workspace = true }
petrovich-wakeword = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks", "blocking"] }
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
webpki-roots = "1"
url = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "fs"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
