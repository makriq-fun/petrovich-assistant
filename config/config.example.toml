# Конфигурация petrovichd. Скопируйте в /data/petrovich/config.toml.
# Секреты — в отдельный файл /data/petrovich/secrets.env с правами 0600.
version = 1

[network]
# Единый прокси для всех сетевых компонентов: STT, LLM, TTS, Tavily,
# web_fetch, погода, Nightscout, Spotify API и librespot.
# Явный proxy у компонента имеет приоритет. SOCKS5 и HTTP(S) работают для
# всех компонентов: для librespot поднимается локальный HTTP CONNECT мост.
# Пример: "socks5h://127.0.0.1:1080" или "http://127.0.0.1:8080".
proxy = ""

[daemon]
log_level = "info"
state_dir = "/data/petrovich/state"
pid_file = "/run/petrovichd.pid"
secrets_file = "/data/petrovich/secrets.env"
# Для устройств без zoneinfo: "MSK-3"; иначе "Europe/Moscow".
timezone = "Europe/Moscow"

[audio]
capture_pcm = "default"
playback_pcm = "default"
capture_rate = 48000
capture_channels = 6
mic_channels = [0, 1, 2, 3]
reference_channels = [4, 5]
sample_rate = 16000
playback_rate = 48000
period_ms = 20
# auto: использовать VQE из прошивки, если он есть; off: только собственный DSP.
vqe = "auto"
vqe_preset = "yandexmini_2"
vqe_models = "/system/vendor/quasar/vqe_models"
aec = true
denoise = true
# Усиление PDM-микрофона на Мини 2; 0 — не трогать.
mic_gain = 0
aec_delay_ms = 0

[wakeword]
enabled = true
# Встроенная openWakeWord-голова «Петрович» (assets/wakeword/petrovich.tflite).
# Для другой модели укажите свой файл и assets/oww.bin.
model = "/data/petrovich/models/petrovich.tflite"
assets = "/data/petrovich/assets/oww.bin"
# Смещение к порогу модели: -0.1 делает срабатывание чаще.
sensitivity = 0.0
refractory_ms = 2000
gain = 1

[commands]
# Штатный command spotter прошивки: быстрые команды без слова активации.
# Модель уже есть на Станции Мини 2; в репозиторий не входит.
# «дальше/назад/играй/продолжи» управляют музыкой, «громче/тише» — звуком,
# «пауза/стоп/хватит» останавливают только то, что сейчас на переднем плане.
enabled = true
model = "/system/vendor/quasar/spotter_models/command"

[vad]
min_speech_ms = 300
silence_ms = 2200
short_silence_ms = 1400
short_utterance_ms = 4000
resume_pause_ms = 1100
max_utterance_ms = 45000
energy_margin_db = 6.0
pre_roll_ms = 300
absolute_db = -55.0

[dialog]
follow_up_ms = 5000
listen_timeout_ms = 10000
history_turns = 8
history_chars = 12000
history_ttl_s = 900
barge_in = true
# Перебивание голосом поверх ответа; без надёжного AEC выключено.
barge_in_voice = false
wake_chime = true
# Подтверждения «услышал», «готово», «остановлено», «диалог очищен».
state_chimes = true
response_timeout_ms = 180000
max_tool_rounds = 20

[memory]
# Долговременная память: факты, которые ассистент сохраняет инструментом
# remember и помнит после сброса диалога и перезапуска. Файл создаётся с
# правами 0600.
enabled = true
# Пусто — <daemon.state_dir>/memory.json.
# path = "/data/petrovich/state/memory.json"
max_entries = 200
max_chars = 8000
# Сколько символов памяти добавлять в системный промпт.
prompt_chars = 2000

[stt]
# openai, fish или command
provider = "openai"
base_url = "https://api.openai.com/v1"
model = "whisper-1"
api_key_env = "PETROVICH_STT_API_KEY"
language = "ru"
timeout_ms = 30000
retries = 2

[llm]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
# Резервные модели того же endpoint: включаются при 429/404 и при отказе
# разбора вызова инструмента. Пусто — только основная модель.
fallback_models = []
api_key_env = "PETROVICH_LLM_API_KEY"
# Дополнительные ключи того же провайдера: при 429/401 ключи перебираются
# до перехода на fallback_models.
api_key_envs = []
temperature = 0.4
max_tokens = 800
timeout_ms = 60000
retries = 2
stream = true
tools = true
# system_prompt по умолчанию — встроенный характер Петровича (дерзкий друг,
# без служебных фраз). Задавайте ключ только чтобы переопределить его целиком;
# без ключа обновления промпта приходят вместе с бинарником.
# system_prompt = """..."""

[tts]
# openai, fish или command
provider = "openai"
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini-tts"
voice = "alloy"
api_key_env = "PETROVICH_TTS_API_KEY"
format = "pcm"
sample_rate = 24000
timeout_ms = 30000
retries = 2
max_bytes = 16777216
# Пусто — общий [network] proxy.
proxy = ""

[tools]
enabled = ["time", "timer", "alarm", "volume", "music", "youtube", "web_search", "emotion", "web_fetch", "weather", "sugar", "computer", "remember", "forget", "reset_dialog", "stop"]
timeout_ms = 10000
web_timeout_ms = 15000
web_max_bytes = 1048576
# Поиск только через Tavily: ключ в secrets.env под этим именем.
# Пусто — инструмент web_search недоступен.
search_proxy = ""
search_api_key_env = "TAVILY_API_KEY"
# Только для отладки: разрешить web_fetch к частным адресам и HTTP.
web_allow_private = false
# Погода: Open-Meteo, ключ не нужен. Координаты задают место по умолчанию;
# без них погода работает только по названному городу через геокодинг.
weather_url = "https://api.open-meteo.com/v1/forecast"
weather_geocoding_url = "https://geocoding-api.open-meteo.com/v1/search"
weather_latitude = 55.7558
weather_longitude = 37.6173
weather_place = "Москва"
# Сахар: базовый URL Nightscout и переменная secrets.env с access token.
# Пусто — инструмент sugar выключен; пустой token_env — запросы без токена.
nightscout_url = ""
nightscout_token_env = ""
# Песочница для run_code: пусто — инструмент выключен.
sandbox_command = []
sandbox_timeout_ms = 5000
# Устаревший внешний backend. При включённом Spotify не используется.
# music_command = ["/data/opt/spotify-connect/spotiya", "--{action}"]
music_command = []
# YouTube только звуком. Пусто — встроенный ByeDPI; явный прокси имеет
# приоритет. Глобальные настройки сети не меняются.
youtube_proxy = ""
# Управление домашним ПК. Без секции [tools.computer] инструмент недоступен.
# Включение и пробуждение — magic packet (WOL); остальные действия идут
# одной командой на ограниченный SSH-endpoint ПК (dbclient из прошивки или
# свой). Свободных команд нет.
# [tools.computer]
# host = "192.168.3.2"
# mac = "fc:34:97:17:d1:00"
# broadcast = "192.168.3.255"
# wake_port = 9
# ssh_port = 2222
# ssh_bin = "/data/petrovich/pc/dbclient"
# key = "/data/petrovich/pc/client-key"
# home = "/data/petrovich/pc"
# timeout_ms = 12000

[modules]
# Отключённый модуль не инициализируется и не запускает фоновые задачи.
youtube = true
web_search = true
weather = true
nightscout = true
display = true
# Spotify Connect работает в petrovichd через librespot. Без логина/пароля
# или access token из secrets.env модуль остаётся выключенным.
spotify = true
byedpi = true

[spotify]
device_name = "Петрович"
username = ""
# Секреты secrets.env: пароль или OAuth access token.
password_env = "PETROVICH_SPOTIFY_PASSWORD"
access_token_env = "PETROVICH_SPOTIFY_TOKEN"
# Поиск идёт токеном Connect-сессии; client_id/секрет — только резерв,
# если сессия авторизована access token без keymaster.
client_id = ""
client_secret_env = "PETROVICH_SPOTIFY_CLIENT_SECRET"
market = "RU"
# Пусто — <state_dir>/spotify. Кэш librespot ограничен 16 МБ.
# cache_dir = "/data/petrovich/state/spotify"
bitrate = 160
search_limit = 10
# Пусто — общий [network] proxy; SOCKS5 подключается через встроенный мост.
proxy = ""

[byedpi]
# 0 — свободный порт loopback; системные настройки не меняются.
listen_port = 0
# Пресеты в формате ByeByeDPI: -d split, -f fake, -o OOB, -s split.
strategies = [
  "-d1 -s1+s -s3+s -s6+s -s12+s -s14+s -s20+s -s24+s -s30+s -a1",
  "-d 1 -s 1",
  "-d 2 -s 2",
  "-d 4 -s 4",
  "-d 16 -s 16",
  "-d 1 -o 1",
  "-d 2 -o 2",
  "-d -1 -f -1 -t 1",
  "split_sni",
]
refresh_s = 300
probe_timeout_ms = 4000
# Проверка настоящего медиапотока, а не только доступности сайта.
probe_video = "jNQXAC9IVRw"
# Пусто — <state_dir>/byedpi.json.
# state_path = "/data/petrovich/state/byedpi.json"

[hardware]
model = "auto"
leds = true
clock = true
buttons = true
action_key = 582
volume_step = 5
led_brightness = 0.8
clock_brightness = 0.35
# Автояркость по датчику ltr308als01 (in_intensity_input / 120).
auto_brightness = true
# Переопределение: каталог IIO-устройства или файл значения.
light_sensor = ""
# Минимальная доля яркости в темноте.
night_brightness = 0.15

[privacy]
check_yandex_connections = true
yandex_hosts = [
  "yandex.net",
  "yandex.ru",
  "yandex.com",
  "uniproxy.alice.yandex.net",
  "clck.yandex.net",
  "quasar.yandex.net",
]
